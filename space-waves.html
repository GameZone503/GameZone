<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Waves - GAMEZONE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:68px;
    background:#050505;
    border-bottom:2px solid #ff9800;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px 0 22px;
}

.logo{
    color:#ff9800;
    font-size:38px;
    font-weight:900;
    letter-spacing:4px;
}

.controles{
    display:flex;
    gap:10px;
}

.boton{
    height:56px;
    min-width:58px;
    border:0;
    border-radius:10px;
    background:#ff9800;
    color:#111;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.boton-volver{
    padding:0 22px;
    font-size:16px;
}

main{
    width:100%;
    height:calc(100vh - 68px);
    background:#000;
}

#juego{
    width:100%;
    height:100%;
    border:0;
    display:block;
}
</style>
</head>

<body>

<header>
    <div class="logo">GAMEZONE</div>

    <div class="controles">
        <button class="boton boton-volver" onclick="volver()">
            ← GAMEZONE
        </button>

        <button class="boton" onclick="location.reload()">
            🔄
        </button>

        <button class="boton" onclick="pantallaCompleta()">
            ⛶
        </button>
    </div>
</header>

<main>
    <iframe
        id="juego"
        src="https://spacewaves.lol/"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</main>

<script>
function volver(){
    window.location.href="index.html";
}

function pantallaCompleta(){
    const juego=document.getElementById("juego");

    if(document.fullscreenElement){
        document.exitFullscreen();
    }else if(juego.requestFullscreen){
        juego.requestFullscreen();
    }
}
</script>

</body>
</html>
