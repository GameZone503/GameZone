<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEZONE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b1020;
    color:white;
}

header{
    background:#111827;
    text-align:center;
    padding:25px 15px;
    border-bottom:2px solid #273449;
}

header h1{
    font-size:42px;
    margin-bottom:8px;
}

header p{
    color:#cbd5e1;
    font-size:18px;
}

#buscador{
    display:block;
    width:min(600px,90%);
    margin:20px auto;
    padding:13px 16px;
    border-radius:8px;
    border:1px solid #334155;
    background:#111827;
    color:white;
    font-size:16px;
    outline:none;
}

main{
    width:min(1200px,94%);
    margin:0 auto;
    padding-bottom:40px;
}

.seccion{
    margin-top:35px;
}

.seccion h2{
    margin-bottom:18px;
    font-size:26px;
}

.juegos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:#111827;
    border:1px solid #263449;
    border-radius:10px;
    overflow:hidden;
}

.portada{
    width:100%;
    height:220px;
    display:block;
    object-fit:cover;
    object-position:center;
    background:#111827;
}

.info{
    padding:14px;
}

.nombre{
    font-size:19px;
    font-weight:bold;
    margin-bottom:12px;
}

.jugar{
    width:100%;
    border:0;
    border-radius:7px;
    padding:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.jugar:hover{
    background:#1d4ed8;
}


/* ================= VISOR DE JUEGOS ================= */

#ventanaJuego{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    flex-direction:column;
    background:#000;
}

.barra-juego{
    min-height:55px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:7px;
    flex-wrap:wrap;
}

.barra-juego button{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    background:#222;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.barra-juego button:hover{
    background:#333;
}

.cerrar{
    background:#b91c1c !important;
}

#juegoFrame{
    width:100%;
    flex:1;
    border:0;
    background:#000;
}


/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .juegos{
        grid-template-columns:repeat(2,1fr);
    }

    .portada{
        height:200px;
    }
}

@media(max-width:650px){

    .juegos{
        grid-template-columns:1fr;
    }

    .portada{
        height:180px;
    }

    header h1{
        font-size:34px;
    }
}

@media(max-width:400px){

    .portada{
        height:220px;
    }

    .barra-juego{
        min-height:60px;
    }

    .barra-juego button{
        padding:8px 10px;
        font-size:12px;
    }
}
</style>
</head>
