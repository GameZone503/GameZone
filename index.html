*{

}

header{

}

.header-contenido{

}

.logo{

    letter-spacing:4px;
    white-space:nowrap;
}

.logo span{
    color:#aaa;
}

.nav{

    gap:10px;
    flex-wrap:wrap;
}

.nav button{

    border:1px solid #333;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.nav button:hover{
    background:#2b2b2b;
}


/* ================================
   HERO
================================ */

.hero{
    width:94%;
    max-width:1450px;

}

}

.hero p{

    font-size:20px;
}

.hero-sub{
    margin-top:12px;
    color:#777;
    font-size:14px;
}


/* ================================
   BUSCADOR
================================ */

.busqueda{
    width:94%;
    max-width:850px;
    margin:0 auto 35px;
}

#buscador{
    width:100%;

    padding:17px 22px;

    border-radius:12px;

    border:1px solid #333;

    background:#151515;

    color:#fff;

    font-size:17px;

    outline:none;

    transition:.2s;
}

#buscador:focus{
    border-color:#777;
    background:#191919;
}

#buscador::placeholder{
    color:#777;
}


/* ================================
   CONTENEDOR
================================ */

.contenedor{
    width:94%;
    max-width:1450px;
    margin:auto;
    padding-bottom:70px;
}


/* ================================
   CATEGORÍAS
================================ */

.categoria{
    margin-top:45px;
}

.titulo-categoria{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;

    border-bottom:1px solid #292929;

    padding-bottom:12px;
}

.titulo-categoria h2{
    font-size:28px;
}

.contador{
    color:#777;
    font-size:14px;
}


/* ================================
   GRID DE JUEGOS
================================ */

.juegos{
    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:18px;
}


/* ================================
   TARJETA
================================ */

.card{
    background:#151515;

    border:1px solid #292929;

    border-radius:13px;

    overflow:hidden;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

    min-width:0;
}

.card:hover{
    transform:translateY(-6px);

    border-color:#555;

    box-shadow:
        0 12px 30px rgba(0,0,0,.5);
}


/* ================================
   PORTADAS
================================ */

.portada{
    width:100%;

    height:220px;

    display:block;

    object-fit:cover;

    background:#222;

    transition:transform .25s ease;
}

.card:hover .portada{
    transform:scale(1.03);
}


/* ================================
   INFORMACIÓN
================================ */

.info{
    padding:14px;
}

.nombre{
    min-height:42px;

    display:flex;
    align-items:center;

    font-size:17px;

    font-weight:800;

    line-height:1.2;

    margin-bottom:12px;
}


/* ================================
   BOTÓN JUGAR
================================ */

.jugar{
    width:100%;

    padding:12px 10px;

    border:1px solid #444;

    border-radius:8px;

    background:#fff;

    color:#000;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.jugar:hover{
    background:#ddd;

    transform:translateY(-1px);
}

.jugar:active{
    transform:scale(.98);
}


/* ================================
   MENSAJE SIN RESULTADOS
================================ */

#sinResultados{

    padding:60px 20px;

    color:#777;

    font-size:18px;
}


/* ================================

================================ */

footer{

    background:#050505;

    text-align:center;

    padding:30px 20px;

    color:#777;
}

footer strong{
    color:#fff;
}


/* ================================
   VENTANA DEL JUEGO
================================ */

#ventanaJuego{
    position:fixed;

    inset:0;

    z-index:99999;

    flex-direction:column;

}


/* ================================

================================ */

    cursor:pointer;

    white-space:nowrap;

    transition:.2s;
}

.barra-juego button:hover{
    background:#333;
}

.barra-juego .boton-volver{
    background:#fff;

    color:#000;

    border-color:#fff;
}

.barra-juego .boton-volver:hover{
    background:#ddd;
}


/* ================================

#tituloJuego{

}


/* ================================

#juegoFrame{

    background:#000;
}

    color:#fff;

    cursor:pointer;

    display:none;

    z-index:500;

    font-size:18px;
}

#arriba:hover{
    background:#292929;
}
