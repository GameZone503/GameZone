<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEZONE - Todos tus juegos en un solo lugar</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#080808;
    border-bottom:1px solid #333;
}

.header-contenido{
    width:94%;
    max-width:1450px;
    margin:auto;
    min-height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:4px;
}

.logo span{
    color:#999;
}

.nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.nav button{
    background:#191919;
    border:1px solid #333;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* HERO */

.hero{
    width:94%;
    max-width:1450px;
    margin:30px auto;
    padding:60px 20px;
    text-align:center;
    border-radius:18px;
    border:1px solid #333;
    background:linear-gradient(135deg,#1b1b1b,#080808);
}

.hero h1{
    font-size:58px;
    letter-spacing:7px;
    margin-bottom:12px;
}

.hero p{
    color:#bbb;
    font-size:20px;
}

/* BUSCADOR */

.busqueda{
    width:94%;
    max-width:850px;
    margin:0 auto 35px;
}

#buscador{
    width:100%;
    padding:17px 20px;
    border-radius:12px;
    border:1px solid #333;
    background:#151515;
    color:white;
    font-size:17px;
    outline:none;
}

/* CONTENEDOR */

.contenedor{
    width:94%;
    max-width:1450px;
    margin:auto;
    padding-bottom:60px;
}

.categoria{
    margin-top:45px;
}

.titulo-categoria{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #333;
    padding-bottom:12px;
    margin-bottom:18px;
}

.titulo-categoria h2{
    font-size:28px;
}

.contador{
    color:#777;
}

/* TARJETAS */

.juegos{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:18px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:13px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#666;
}

.portada{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    background:#222;
}

.info{
    padding:14px;
}

.nombre{
    min-height:42px;
    display:flex;
    align-items:center;
    font-weight:bold;
    margin-bottom:12px;
}

.jugar{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.jugar:hover{
    background:#ddd;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid #333;
    color:#777;
}

/* ==================================
   VENTANA GENERAL DE TODOS LOS JUEGOS
================================== */

#ventanaJuego{
    position:fixed;
    inset:0;
    z-index:999999;
    display:none;
    flex-direction:column;
    background:#000;
}

/* BARRA */

.barra-juego{
    height:58px;
    min-height:58px;
    background:#111;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
}

.barra-juego button{
    border:1px solid #444;
