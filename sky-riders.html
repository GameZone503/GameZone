<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEZONE - Sky Riders</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

header{
    height:60px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    background:#252525;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#3a3a3a;
}

.game{
    width:100%;
    height:calc(100vh - 60px);
}

iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}
</style>
</head>

<body>

<header>
    <div class="logo">GAMEZONE</div>

    <div class="buttons">
        <button onclick="volver()">VOLVER</button>
        <button onclick="reiniciar()">REINICIAR</button>
        <button onclick="pantallaCompleta()">PANTALLA COMPLETA</button>
    </div>
</header>

<div class="game">
    <iframe
        id="gameFrame"
        src="https://www.bubbleshooter.net/embed.php?id=2051"
        allow="fullscreen; autoplay"
        allowfullscreen>
    </iframe>
</div>

<script>
function volver(){
    window.location.href="index.html";
}

function reiniciar(){
    const frame=document.getElementById("gameFrame");
    frame.src=frame.src;
}

function pantallaCompleta(){
    const frame=document.getElementById("gameFrame");

    if(frame.requestFullscreen){
        frame.requestFullscreen();
    }
}
</script>

</body>
</html>
