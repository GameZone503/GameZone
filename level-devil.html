<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Devil - GAMEZONE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #080808;
    padding: 18px 10px;
    border-bottom: 2px solid #333;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 3px;
}

.subtitulo {
    color: #aaa;
    margin-top: 5px;
}

.controles {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #222;
    color: white;
}

button:hover {
    background: #444;
}

#reiniciar {
    background: #b51f1f;
}

#reiniciar:hover {
    background: #d52b2b;
}

#pantalla {
    background: #1769aa;
}

#pantalla:hover {
    background: #2185d0;
}

#juego {
    width: min(900px, 95vw);
    height: min(600px, 70vh);
    min-height: 400px;
    background: #202020;
    border: 3px solid #555;
    display: block;
    margin: 10px auto 25px;
}

.info {
    color: #aaa;
    margin-bottom: 20px;
}

@media (max-width: 600px) {
    .logo {
        font-size: 26px;
    }

    #juego {
        min-height: 360px;
    }

    button {
        padding: 10px 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">GAMEZONE</div>
    <div class="subtitulo">Todos tus juegos en un solo lugar</div>
</header>

<div class="controles">
    <button onclick="volver()">← VOLVER</button>
    <button id="reiniciar" onclick="reiniciar()">↻ REINICIAR</button>
    <button id="pantalla" onclick="pantallaCompleta()">⛶ PANTALLA COMPLETA</button>
</div>

<canvas id="juego" width="900" height="600"></canvas>

<div class="info">
    Usa ← → para moverte y ESPACIO para saltar
</div>

<script>
const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");

let nivel = 1;
const totalNiveles = 5;

let jugador = {
    x: 80,
    y: 450,
    w: 30,
    h: 40,
    vx: 0,
    vy: 0,
    velocidad: 5,
    salto: -12,
    enSuelo: false
};

let teclas = {};
let muerto = false;
let ganado = false;

const gravedad = 0.6;

const niveles = [
    {
        plataformas: [
            {x:0,y:540,w:900,h:60},
            {x:250,y:430,w:180,h:25},
            {x:520,y:350,w:180,h:25},
            {x:760,y:270,w:100,h:25}
        ],
        puerta: {x:820,y:200,w:45,h:70},
        trampas: [
            {x:450,y:515,w:50,h:25}
        ]
    },

    {
        plataformas: [
            {x:0,y:540,w:900,h:60},
            {x:170,y:450,w:140,h:25},
            {x:390,y:390,w:140,h:25},
            {x:610,y:320,w:140,h:25},
            {x:790,y:250,w:90,h:25}
        ],
        puerta: {x:815,y:180,w:45,h:70},
        trampas: [
            {x:310,y:515,w:55,h:25},
            {x:540,y:515,w:55,h:25}
        ]
    },

    {
        plataformas: [
            {x:0,y:540,w:900,h:60},
            {x:100,y:430,w:150,h:25},
            {x:350,y:350,w:150,h:25},
            {x:600,y:430,w:150,h:25},
            {x:800,y:330,w:70,h:25}
        ],
        puerta: {x:810,y:260,w:45,h:70},
        trampas: [
            {x:250,y:515,w:60,h:25},
            {x:500,y:515,w:60,h:25},
            {x:750,y:515,w:60,h:25}
        ]
    },

    {
        plataformas: [
            {x:0,y:540,w:900,h:60},
            {x:180,y:420,w:120,h:25},
            {x:400,y:300,w:120,h:25},
            {x:620,y:420,w:120,h:25},
            {x:800,y:300,w:70,h:25}
        ],
        puerta: {x:815,y:220,w:45,h:70},
        trampas: [
            {x:300,y:515,w:70,h:25},
            {x:530,y:515,w:70,h:25},
            {x:740,y:515,w:60,h:25}
        ]
    },

    {
        plataformas: [
            {x:0,y:540,w:900,h:60},
            {x:130,y:430,w:120,h:25},
            {x:300,y:350,w:120,h:25},
            {x:470,y:430,w:120,h:25},
            {x:640,y:330,w:120,h:25},
            {x:800,y:250,w:70,h:25}
        ],
        puerta: {x:815,y:170,w:45,h:70},
        trampas: [
            {x:250,y:515,w:50,h:25},
            {x:420,y:515,w:50,h:25},
            {x:590,y:515,w:50,h:25},
            {x:760,y:515,w:50,h:25}
        ]
    }
];

function reiniciarJugador() {
    jugador.x = 60;
    jugador.y = 450;
    jugador.vx = 0;
    jugador.vy = 0;
    muerto = false;
    ganado = false;
}

function reiniciar() {
    nivel = 1;
    reiniciarJugador();
}

function volver() {
    window.location.href = "index.html";
}

function pantallaCompleta() {
    if (canvas.requestFullscreen) {
        canvas.requestFullscreen();
    }
}

document.addEventListener("keydown", function(e) {
    teclas[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ) {
        e.preventDefault();
    }

    if (
        (e.key === " " || e.key === "ArrowUp" || e.key.toLowerCase() === "w") &&
        jugador.enSuelo &&
        !muerto &&
        !ganado
    ) {
        jugador.vy = jugador.salto;
        jugador.enSuelo = false;
    }

    if (e.key.toLowerCase() === "r") {
        reiniciarJugador();
    }
});

document.addEventListener("keyup", function(e) {
    teclas[e.key.toLowerCase()] = false;
});

function colision(a, b) {
    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}

function actualizar() {

    if (muerto || ganado) {
        return;
    }

    jugador.vx = 0;

    if (teclas["arrowleft"] || teclas["a"]) {
        jugador.vx = -jugador.velocidad;
    }

    if (teclas["arrowright"] || teclas["d"]) {
        jugador.vx = jugador.velocidad;
    }

    jugador.x += jugador.vx;

    if (jugador.x < 0) {
        jugador.x = 0;
    }

    if (jugador.x + jugador.w > canvas.width) {
        jugador.x = canvas.width - jugador.w;
    }

    jugador.vy += gravedad;
    jugador.y += jugador.vy;

    jugador.enSuelo = false;

    const datos = niveles[nivel - 1];

    for (const plataforma of datos.plataformas) {

        if (
            jugador.x + jugador.w > plataforma.x &&
            jugador.x < plataforma.x + plataforma.w &&
            jugador.y + jugador.h > plataforma.y &&
            jugador.y + jugador.h < plataforma.y + plataforma.h + 15 &&
            jugador.vy >= 0
        ) {
            jugador.y = plataforma.y - jugador.h;
            jugador.vy = 0;
            jugador.enSuelo = true;
        }
    }

    for (const trampa of datos.trampas) {

        if (colision(jugador, trampa)) {
            morir();
        }
    }

    if (colision(jugador, datos.puerta)) {
        siguienteNivel();
    }

    if (jugador.y > canvas.height + 100) {
        morir();
    }
}

function morir() {

    muerto = true;

    setTimeout(function() {
        reiniciarJugador();
    }, 800);
}

function siguienteNivel() {

    if (nivel < totalNiveles) {
        nivel++;
        reiniciarJugador();
    } else {
        ganado = true;
    }
}

function dibujarFondo() {

    ctx.fillStyle = "#151515";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#1d1d1d";

    for (let x = 0; x < canvas.width; x += 40) {
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.fillRect(x, y, 1, 1);
        }
    }
}

function dibujarPlataformas() {

    const datos = niveles[nivel - 1];

    for (const p of datos.plataformas) {

        ctx.fillStyle = "#777";
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = "#999";
        ctx.fillRect(p.x, p.y, p.w, 5);
    }
}

function dibujarTrampas() {

    const datos = niveles[nivel - 1];

    for (const t of datos.trampas) {

        ctx.fillStyle = "#e33";

        const cantidad = Math.max(1, Math.floor(t.w / 20));

        for (let i = 0; i < cantidad; i++) {

            const x = t.x + i * 20;

            ctx.beginPath();
            ctx.moveTo(x, t.y + t.h);
            ctx.lineTo(x + 10, t.y);
            ctx.lineTo(x + 20, t.y + t.h);
            ctx.closePath();
            ctx.fill();
        }
    }
}

function dibujarPuerta() {

    const p = niveles[nivel - 1].puerta;

    ctx.fillStyle = "#42e65b";
    ctx.fillRect(p.x, p.y, p.w, p.h);

    ctx.fillStyle = "#111";
    ctx.fillRect(p.x + 10, p.y + 25, 7, 7);
}

function dibujarJugador() {

    ctx.fillStyle = "#f1f1f1";
    ctx.fillRect(
        jugador.x,
        jugador.y,
        jugador.w,
        jugador.h
    );

    ctx.fillStyle = "#222";
    ctx.fillRect(
        jugador.x + 6,
        jugador.y + 8,
        5,
        5
    );

    ctx.fillRect(
        jugador.x + 19,
        jugador.y + 8,
        5,
        5
    );
}

function dibujarTexto() {

    ctx.fillStyle = "white";
    ctx.font = "bold 22px Arial";

    ctx.fillText(
        "NIVEL " + nivel + " / " + totalNiveles,
        20,
        35
    );

    if (muerto) {

        ctx.fillStyle = "#ff4444";
        ctx.font = "bold 40px Arial";
        ctx.fillText(
            "¡UPS!",
            canvas.width / 2 - 60,
            canvas.height / 2
        );
    }

    if (ganado) {

        ctx.fillStyle = "#45e65c";
        ctx.font = "bold 42px Arial";
        ctx.fillText(
            "¡GANASTE!",
            canvas.width / 2 - 120,
            canvas.height / 2
        );

        ctx.font = "20px Arial";
        ctx.fillStyle = "white";

        ctx.fillText(
            "Presiona REINICIAR para jugar otra vez",
            canvas.width / 2 - 180,
            canvas.height / 2 + 45
        );
    }
}

function dibujar() {

    dibujarFondo();
    dibujarPlataformas();
    dibujarTrampas();
    dibujarPuerta();

    if (!ganado) {
        dibujarJugador();
    }

    dibujarTexto();
}

function juego() {

    actualizar();
    dibujar();

    requestAnimationFrame(juego);
}

reiniciarJugador();
juego();
</script>

</body>
</html>
