<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Level Devil - GameZone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        linear-gradient(#202020 0 72%,#151515 72% 100%);
}

/* TECHO */
#techo{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:45px;
    background:#292929;
    border-bottom:4px solid #555;
}

/* PISO */
#piso{
    position:absolute;
    left:0;
    bottom:17%;
    width:100%;
    height:25px;
    background:#eee;
    box-shadow:0 0 0 4px #111;
}

/* BANDERA */
#meta{
    position:absolute;
    bottom:calc(17% + 25px);
    right:7%;
    width:45px;
    height:80px;
}

#poste{
    position:absolute;
    left:5px;
    bottom:0;
    width:5px;
    height:80px;
    background:#ddd;
}

#bandera{
    position:absolute;
    top:0;
    left:10px;
    width:35px;
    height:25px;
    background:#31e86d;
    clip-path:polygon(0 0,100% 50%,0 100%);
}

/* JUGADOR */
#player{
    position:absolute;
    width:32px;
    height:42px;
    background:#ffcc33;
    border-radius:7px 7px 4px 4px;
    bottom:calc(17% + 25px);
    left:8%;
    box-shadow:inset 0 -7px #e99e00;
}

/* OJOS */
#player:before,
#player:after{
    content:"";
    position:absolute;
    top:10px;
    width:5px;
    height:5px;
    background:#111;
    border-radius:50%;
}

#player:before{
    left:7px;
}

#player:after{
    right:7px;
}

/* PINCHOS */
.pincho{
    position:absolute;
    bottom:calc(17% + 25px);
    width:0;
    height:0;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-bottom:32px solid #e33;
    filter:drop-shadow(0 0 2px #000);
}

/* MENSAJE */
#mensaje{
    position:absolute;
    top:12%;
    width:100%;
    text-align:center;
    font-size:clamp(22px,4vw,40px);
    font-weight:900;
    opacity:.9;
}

/* HUD */
#hud{
    position:absolute;
    top:58px;
    left:20px;
    font-size:18px;
    font-weight:bold;
    z-index:10;
}

/* CONTROLES */
#controles{
    position:absolute;
    bottom:3%;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:12px;
    z-index:20;
}

.control{
    width:58px;
    height:48px;
    border:0;
    border-radius:12px;
    background:#333;
    color:white;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 4px 0 #111;
}

.control:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #111;
}

/* PANTALLA FINAL */
#final{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.88);
    align-items:center;
    justify-content:center;
    text-align:center;
    flex-direction:column;
    gap:20px;
}

#final h1{
    font-size:clamp(35px,8vw,70px);
    color:#36ed70;
}

#final button{
    padding:14px 30px;
    border:0;
    border-radius:30px;
    background:#00eaff;
    color:#001018;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="game">

    <div id="techo"></div>

    <div id="hud">
        NIVEL <span id="nivel">1</span> / 10
    </div>

    <div id="mensaje">
        LLEGA A LA BANDERA
    </div>

    <div id="piso"></div>

    <div id="meta">
        <div id="poste"></div>
        <div id="bandera"></div>
    </div>

    <div id="player"></div>

    <div id="controles">
        <button class="control" id="izq">◀</button>
        <button class="control" id="salto">▲</button>
        <button class="control" id="der">▶</button>
    </div>

    <div id="final">
        <h1>¡GANASTE!</h1>
        <p>Completaste todos los niveles.</p>
        <button onclick="reiniciarTodo()">JUGAR DE NUEVO</button>
    </div>

</div>

<script>
const player = document.getElementById("player");
const game = document.getElementById("game");
const nivelTexto = document.getElementById("nivel");

let x = 8;
let y = 0;

let velocidadX = 0;
let velocidadY = 0;

let enSuelo = true;
let jugando = true;

let nivel = 1;

const gravedad = 0.75;
const salto = 13;
const velocidad = 4;

const niveles = [
    [35,55],
    [50,70],
    [30,60,78],
    [45,65,82],
    [25,48,70,88],
    [40,58,75],
    [32,52,68,84],
    [45,63,78,91],
    [28,46,64,82],
    [40,55,70,85]
];

let pinchos = [];


/* CREAR PINCHOS */

function crearNivel(){

    pinchos.forEach(p => p.remove());

    pinchos = [];

    const posiciones = niveles[nivel-1] || [];

    posiciones.forEach(pos => {

        const p = document.createElement("div");

        p.className = "pincho";

        p.style.left = pos + "%";

        game.appendChild(p);

        pinchos.push(p);

    });

    nivelTexto.textContent = nivel;

    x = 8;
    y = 0;

    velocidadX = 0;
    velocidadY = 0;

    enSuelo = true;

    actualizarJugador();
}


/* ACTUALIZAR */

function actualizarJugador(){

    player.style.left = x + "%";
    player.style.bottom =
        "calc(17% + 25px + " + y + "px)";
}


/* MOVIMIENTO */

function mover(){

    if(!jugando) return;

    x += velocidadX;

    if(x < 1) x = 1;

    if(x > 95) x = 95;

    if(!enSuelo){

        y += velocidadY;

        velocidadY -= gravedad;

        if(y <= 0){

            y = 0;
            velocidadY = 0;
            enSuelo = true;

        }

    }

    actualizarJugador();

    comprobarPinchos();

    comprobarMeta();

    requestAnimationFrame(mover);
}


/* IZQUIERDA */

function izquierda(){

    velocidadX = -velocidad;

}


/* DERECHA */

function derecha(){

    velocidadX = velocidad;

}


/* PARAR */

function parar(){

    velocidadX = 0;

}


/* SALTAR */

function saltar(){

    if(enSuelo){

        velocidadY = salto;

        enSuelo = false;

    }

}


/* PINCHOS */

function comprobarPinchos(){

    const pr = player.getBoundingClientRect();

    for(const p of pinchos){

        const r = p.getBoundingClientRect();

        if(

            pr.left < r.right - 5 &&
            pr.right > r.left + 5 &&
            pr.top < r.bottom &&
            pr.bottom > r.top + 8

        ){

            morir();

            return;

        }

    }

}


/* META */

function comprobarMeta(){

    if(x >= 90){

        siguienteNivel();

    }

}


/* MORIR */

function morir(){

    x = 8;
    y = 0;

    velocidadX = 0;
    velocidadY = 0;

    enSuelo = true;

    actualizarJugador();

}


/* SIGUIENTE NIVEL */

function siguienteNivel(){

    if(nivel >= 10){

        ganar();

        return;

    }

    nivel++;

    crearNivel();

}


/* GANAR */

function ganar(){

    jugando = false;

    document.getElementById("final").style.display="flex";

}


/* REINICIAR TODO */

function reiniciarTodo(){

    document.getElementById("final").style.display="none";

    nivel = 1;

    jugando = true;

    crearNivel();

    requestAnimationFrame(mover);

}


/* TECLADO */

document.addEventListener("keydown",function(e){

    if(e.key==="ArrowLeft" || e.key==="a"){

        izquierda();

    }

    if(e.key==="ArrowRight" || e.key==="d"){

        derecha();

    }

    if(
        e.key==="ArrowUp" ||
        e.key==="w" ||
        e.key===" "
    ){

        e.preventDefault();

        saltar();

    }

});


document.addEventListener("keyup",function(e){

    if(
        e.key==="ArrowLeft" ||
        e.key==="ArrowRight" ||
        e.key==="a" ||
        e.key==="d"
    ){

        parar();

    }

});


/* BOTONES */

const botonIzq = document.getElementById("izq");
const botonDer = document.getElementById("der");
const botonSalto = document.getElementById("salto");

botonIzq.addEventListener("pointerdown",izquierda);
botonDer.addEventListener("pointerdown",derecha);
botonSalto.addEventListener("pointerdown",saltar);

botonIzq.addEventListener("pointerup",parar);
botonDer.addEventListener("pointerup",parar);

botonIzq.addEventListener("pointerleave",parar);
botonDer.addEventListener("pointerleave",parar);


/* INICIAR */

crearNivel();
requestAnimationFrame(mover);
</script>

</body>
</html>
