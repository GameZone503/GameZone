```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Devil - GameZone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.barra{
    height:55px;
    background:#111;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:7px;
}

.barra button{
    border:1px solid #444;
    border-radius:7px;
    padding:10px 16px;
    background:#222;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.barra button:hover{
    background:#333;
}

.juego{
    width:100%;
    height:calc(100vh - 55px);
    border:0;
    display:block;
    background:#000;
}

.mensaje{
    position:absolute;
    top:55px;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:25px;
    background:#080808;
    color:white;
}

.mensaje h1{
    font-size:30px;
    margin-bottom:12px;
}

.mensaje p{
    color:#aaa;
    max-width:500px;
    line-height:1.5;
}

.mensaje button{
    margin-top:20px;
    padding:12px 20px;
    border:0;
    border-radius:8px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.oculto{
    display:none;
}
</style>
</head>

<body>

<div class="barra">

<button onclick="volver()">
← VOLVER
</button>

<button onclick="reiniciar()">
🔄 REINICIAR
</button>

<button onclick="pantallaCompleta()">
⛶ PANTALLA COMPLETA
</button>

</div>

<iframe
id="juego"
class="juego"
src="https://poki.com/es/g/level-devil"
allow="fullscreen; autoplay; gamepad"
allowfullscreen>
</iframe>

<div id="mensaje" class="mensaje oculto">

<h1>Level Devil</h1>

<p>
Este juego externo no permite que Poki se muestre dentro de GameZone.
</p>

<button onclick="abrirJuego()">
🎮 ABRIR JUEGO
</button>

</div>

<script>

const juego=document.getElementById("juego");
const mensaje=document.getElementById("mensaje");

function volver(){

window.location.href="index.html";

}

function reiniciar(){

juego.src="";

setTimeout(function(){

juego.src="https://poki.com/es/g/level-devil";

},100);

}

function pantallaCompleta(){

if(juego.requestFullscreen){

juego.requestFullscreen();

}else if(juego.webkitRequestFullscreen){

juego.webkitRequestFullscreen();

}

}

function abrirJuego(){

window.open(
"https://poki.com/es/g/level-devil",
"_blank"
);

}

</script>

</body>
</html>
```
