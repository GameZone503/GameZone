<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Devil - GameZone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#f05a24;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

#game{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.top{
    height:58px;
    background:#171717;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    z-index:20;
}

.top h1{
    font-size:22px;
}

#levelText{
    font-weight:bold;
}

#restart{
    background:#e53935;
    color:white;
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

#world{
    position:relative;
    flex:1;
    overflow:hidden;
    background:#f4b52b;
}

#level{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(1000px,95vw);
    height:min(560px,78vh);
    background:#f7c934;
    overflow:hidden;
}

/* jugador */
#player{
    position:absolute;
    width:30px;
    height:38px;
    background:#111;
    border-radius:5px 5px 2px 2px;
    z-index:10;
}

/* suelo */
.platform{
    position:absolute;
    background:#e63b32;
    height:28px;
    z-index:4;
}

/* techo */
.ceiling{
    position:absolute;
    background:#e63b32;
    height:25px;
    z-index:4;
}

/* pinchos */
.spike{
    position:absolute;
    width:0;
    height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-bottom:30px solid #151515;
    z-index:7;
}

/* llave */
.key{
    position:absolute;
    width:20px;
    height:20px;
    border:5px solid #ffdf00;
    border-radius:50%;
    z-index:8;
}

.key:after{
    content:"";
    position:absolute;
    width:15px;
    height:5px;
    background:#ffdf00;
    left:12px;
    top:3px;
}

/* puerta */
.door{
    position:absolute;
    width:48px;
    height:72px;
    background:#eeeeee;
    border:5px solid #555;
    bottom:28px;
    z-index:5;
}

.door:after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    background:#222;
    border-radius:50%;
    right:7px;
    top:32px;
}

.locked{
    background:#777;
}

/* portal */
#portal{
    position:absolute;
    width:75px;
    height:105px;
    border-radius:50%;
    border:9px solid #682cff;
    background:#24104c;
    box-shadow:
        0 0 15px #7d42ff,
        0 0 35px #7d42ff,
        inset 0 0 20px #b987ff;
    z-index:12;
    display:none;
    animation:portal 1s infinite alternate;
}

@keyframes portal{
    from{
        transform:scale(.92);
    }
    to{
        transform:scale(1.08);
    }
}

#portalText{
    position:absolute;
    color:white;
    font-size:14px;
    font-weight:bold;
    text-align:center;
    width:180px;
    left:-53px;
    top:-35px;
    text-shadow:0 2px 4px #000;
}

/* mensaje */
#message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.88);
    color:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    z-index:30;
    display:none;
    min-width:260px;
}

#message h2{
    margin-bottom:10px;
}

#message button{
    margin-top:15px;
    padding:11px 20px;
    border:0;
    border-radius:8px;
    background:#35c759;
    color:white;
    font-weight:bold;
}

/* controles */
.controls{
    position:absolute;
    bottom:15px;
    left:15px;
    display:flex;
    gap:10px;
    z-index:25;
}

.controls button{
    width:60px;
    height:60px;
    border:0;
    border-radius:12px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:25px;
}

.rightControls{
    position:absolute;
    bottom:15px;
    right:15px;
    z-index:25;
}

.rightControls button{
    width:75px;
    height:60px;
    border:0;
    border-radius:12px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:13px;
    font-weight:bold;
}

@media(max-width:600px){
    #level{
        width:96vw;
        height:65vh;
    }

    .top h1{
        font-size:17px;
    }

    .controls button{
        width:55px;
        height:55px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="top">
        <h1>GAMEZONE</h1>
        <div id="levelText">NIVEL 1</div>
        <button id="restart">🔄</button>
    </div>

    <div id="world">

        <div id="level"></div>

        <div id="player"></div>

        <div id="portal">
            <div id="portalText">PORTAL</div>
        </div>

        <div id="message">
            <h2 id="messageTitle">¡Nivel completado!</h2>
            <p id="messageText"></p>
            <button id="messageButton">CONTINUAR</button>
        </div>

        <div class="controls">
            <button id="left">◀</button>
            <button id="jump">▲</button>
            <button id="right">▶</button>
        </div>

        <div class="rightControls">
            <button id="mobileRestart">REINICIAR</button>
        </div>

    </div>
</div>

<script>
const levelBox = document.getElementById("level");
const player = document.getElementById("player");
const portal = document.getElementById("portal");
const levelText = document.getElementById("levelText");
const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const messageButton = document.getElementById("messageButton");

let currentLevel = 1;

let px = 50;
let py = 0;
let vx = 0;
let vy = 0;

let leftPressed = false;
let rightPressed = false;
let jumpPressed = false;

let grounded = false;
let hasKey = false;
let levelWon = false;

const gravity = 0.65;
const speed = 4.5;
const jumpPower = 12;

const levels = [];

/* crear 20 niveles */
for(let i=1;i<=20;i++){

    let data = {
        key:null,
        door:{x:900},
        spikes:[],
        platforms:[
            {x:0,y:500,w:1000,h:28}
        ]
    };

    if(i>1){
        data.spikes.push(
            {x:250,y:470},
            {x:420,y:470},
            {x:650,y:470}
        );
    }

    if(i%2===0){
        data.key={x:500,y:400};

        data.platforms.push(
            {x:350,y:410,w:180,h:22},
            {x:600,y:350,w:180,h:22}
        );
    }

    if(i%3===0){
        data.spikes.push(
            {x:330,y:380},
            {x:550,y:320},
            {x:760,y:470}
        );
    }

    if(i%4===0){
        data.platforms.push(
            {x:150,y:390,w:130,h:22},
            {x:430,y:300,w:150,h:22},
            {x:700,y:250,w:140,h:22}
        );

        data.key={x:735,y:200};
    }

    levels.push(data);
}

/* nivel 20: portal */
levels[19].key={
    x:500,
    y:380
};

levels[19].platforms.push(
    {x:350,y:420,w:180,h:22},
    {x:650,y:360,w:170,h:22}
);

/* portal */
function createPortal(){
    portal.style.left="850px";
    portal.style.top="360px";
    portal.style.display="block";
}

/* cargar nivel */
function loadLevel(number){

    currentLevel=number;

    levelText.textContent=
        number<=20
        ? "NIVEL "+number
        : "ZONA 2 - NIVEL "+(number-20);

    levelBox.innerHTML="";

    hasKey=false;
    levelWon=false;

    portal.style.display="none";

    px=50;
    py=430;
    vx=0;
    vy=0;

    const data=levels[(number-1)%20];

    /* plataformas */
    data.platforms.forEach(p=>{

        const el=document.createElement("div");

        el.className="platform";

        el.style.left=p.x+"px";
        el.style.top=p.y+"px";
        el.style.width=p.w+"px";
        el.style.height=p.h+"px";

        levelBox.appendChild(el);
    });

    /* pinchos */
    data.spikes.forEach(s=>{

        const el=document.createElement("div");

        el.className="spike";

        el.style.left=s.x+"px";
        el.style.top=s.y+"px";

        levelBox.appendChild(el);
    });

    /* llave */
    if(data.key){

        const key=document.createElement("div");

        key.className="key";

        key.style.left=data.key.x+"px";
        key.style.top=data.key.y+"px";

        key.id="key";

        levelBox.appendChild(key);
    }

    /* puerta */
    const door=document.createElement("div");

    door.className="door locked";
    door.style.left=data.door.x+"px";

    door.id="door";

    levelBox.appendChild(door);

    player.style.left=px+"px";
    player.style.top=py+"px";

    message.style.display="none";
}

/* colisión */
function rects(a,b){

    return(
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
    );
}

function getRect(el){
    return el.getBoundingClientRect();
}

/* comprobar mundo */
function update(){

    if(levelWon)return;

    if(leftPressed) vx=-speed;
    else if(rightPressed) vx=speed;
    else vx*=0.8;

    px+=vx;

    if(px<0)px=0;
    if(px>950)px=950;

    vy+=gravity;
    py+=vy;

    grounded=false;

    const playerRect={
        left:px,
        right:px+30,
        top:py,
        bottom:py+38
    };

    const platforms=document.querySelectorAll(".platform");

    platforms.forEach(el=>{

        const r=el.getBoundingClientRect();
        const worldRect=levelBox.getBoundingClientRect();

        const p={
            left:r.left-worldRect.left,
            right:r.right-worldRect.left,
            top:r.top-worldRect.top,
            bottom:r.bottom-worldRect.top
        };

        if(
            playerRect.right>p.left &&
            playerRect.left<p.right &&
            playerRect.bottom>p.top &&
            playerRect.bottom<p.bottom+20 &&
            vy>=0
        ){
            py=p.top-38;
            vy=0;
            grounded=true;
        }
    });

    /* saltar */
    if(jumpPressed && grounded){
        vy=-jumpPower;
        grounded=false;
    }

    jumpPressed=false;

    /* caer fuera */
    if(py>570){
        die();
    }

    /* pinchos */
    document.querySelectorAll(".spike").forEach(el=>{

        const r=el.getBoundingClientRect();
        const worldRect=levelBox.getBoundingClientRect();

        const s={
            left:r.left-worldRect.left,
            right:r.right-worldRect.left,
            top:r.top-worldRect.top,
            bottom:r.bottom-worldRect.top
        };

        if(
            playerRect.right>s.left &&
            playerRect.left<s.right &&
            playerRect.bottom>s.top+5 &&
            playerRect.top<s.bottom
        ){
            die();
        }
    });

    /* llave */
    const key=document.getElementById("key");

    if(key && !hasKey){

        const r=key.getBoundingClientRect();
        const worldRect=levelBox.getBoundingClientRect();

        const k={
            left:r.left-worldRect.left,
            right:r.right-worldRect.left,
            top:r.top-worldRect.top,
            bottom:r.bottom-worldRect.top
        };

        if(rects(playerRect,k)){

            hasKey=true;
            key.remove();

            const door=document.getElementById("door");

            if(door){
                door.classList.remove("locked");
            }
        }
    }

    /* puerta */
    const door=document.getElementById("door");

    if(door){

        const r=door.getBoundingClientRect();
        const worldRect=levelBox.getBoundingClientRect();

        const d={
            left:r.left-worldRect.left,
            right:r.right-worldRect.left,
            top:r.top-worldRect.top,
            bottom:r.bottom-worldRect.top
        };

        if(rects(playerRect,d)){

            if(!levels[(currentLevel-1)%20].key || hasKey){
                completeLevel();
            }
        }
    }

    /* portal */
    if(currentLevel===20 && hasKey){

        createPortal();

        const r=portal.getBoundingClientRect();
        const worldRect=levelBox.getBoundingClientRect();

        const po={
            left:r.left-worldRect.left,
            right:r.right-worldRect.left,
            top:r.top-worldRect.top,
            bottom:r.bottom-worldRect.top
        };

        if(rects(playerRect,po)){
            nextZone();
        }
    }

    player.style.left=px+"px";
    player.style.top=py+"px";

    requestAnimationFrame(update);
}

function die(){

    loadLevel(currentLevel);
}

/* completar */
function completeLevel(){

    if(levelWon)return;

    levelWon=true;

    if(currentLevel<20){

        messageTitle.textContent="¡NIVEL COMPLETADO!";

        messageText.textContent=
            "Preparándote para el nivel "+(currentLevel+1);

        messageButton.textContent="SIGUIENTE NIVEL";

        messageButton.onclick=()=>{
            loadLevel(currentLevel+1);
            requestAnimationFrame(update);
        };

    }else{

        messageTitle.textContent="¡COMPLETASTE LOS 20 NIVELES!";

        messageText.textContent=
            "El portal se ha desbloqueado. Entra al portal para continuar.";

        messageButton.textContent="IR AL PORTAL";

        messageButton.onclick=()=>{
            message.style.display="none";
            levelWon=false;
            createPortal();
            requestAnimationFrame(update);
        };
    }

    message.style.display="block";
}

/* zona siguiente */
function nextZone(){

    messageTitle.textContent="¡PORTAL ACTIVADO!";

    messageText.textContent=
        "Has llegado a la siguiente zona.";

    messageButton.textContent="SIGUIENTE NIVEL";

    messageButton.onclick=()=>{

        message.style.display="none";

        currentLevel=21;

        loadLevel(21);

        requestAnimationFrame(update);
    };

    message.style.display="block";
}

/* teclado */
document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        leftPressed=true;
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        rightPressed=true;
    }

    if(
        e.key==="ArrowUp" ||
        e.key===" " ||
        e.key.toLowerCase()==="w"
    ){
        jumpPressed=true;
    }

    if(e.key==="r"){
        loadLevel(currentLevel);
        requestAnimationFrame(update);
    }
});

document.addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
        leftPressed=false;
    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
        rightPressed=false;
    }
});

/* botones móviles */
function holdButton(button,down,up){

    button.addEventListener("touchstart",e=>{
        e.preventDefault();
        down();
    });

    button.addEventListener("touchend",e=>{
        e.preventDefault();
        up();
    });

    button.addEventListener("mousedown",down);
    button.addEventListener("mouseup",up);
    button.addEventListener("mouseleave",up);
}

holdButton(
    document.getElementById("left"),
    ()=>leftPressed=true,
    ()=>leftPressed=false
);

holdButton(
    document.getElementById("right"),
    ()=>rightPressed=true,
    ()=>rightPressed=false
);

document.getElementById("jump").addEventListener("touchstart",e=>{
    e.preventDefault();
    jumpPressed=true;
});

document.getElementById("jump").addEventListener("mousedown",()=>{
    jumpPressed=true;
});

document.getElementById("restart").onclick=()=>{
    loadLevel(currentLevel);
    requestAnimationFrame(update);
};

document.getElementById("mobileRestart").onclick=()=>{
    loadLevel(currentLevel);
    requestAnimationFrame(update);
};

loadLevel(1);
requestAnimationFrame(update);
</script>

</body>
</html>
