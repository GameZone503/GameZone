<title>Level Devil - GameZone</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  user-select:none;
}

#game{
  width:100vw;
  height:100vh;
  background:#f5a623;
  position:relative;
}

#bar{
  height:58px;
  background:#171717;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:relative;
  z-index:50;
}

#bar strong{
  font-size:21px;
}

#levelName{
  font-weight:bold;
}

#restart{
  border:0;
  background:#e53935;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
}

#gameArea{
  position:absolute;
  left:0;
  right:0;
  top:58px;
  bottom:0;
  overflow:hidden;
}

#world{
  position:absolute;
  width:1100px;
  height:620px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#f8c62d;
  overflow:hidden;
}

/* PERSONAJE */

#player{
  position:absolute;
  width:28px;
  height:38px;
  background:#111;
  border-radius:5px 5px 3px 3px;
  z-index:20;
}

#player:before{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  left:6px;
  top:8px;
}

#player:after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  right:6px;
  top:8px;
}

/* SUELO */

.block{
  position:absolute;
  background:#df3b32;
  z-index:5;
}

/* PINCHOS */

.spike{
  position:absolute;
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-bottom:34px solid #151515;
  z-index:15;
}

/* LLAVE */

.key{
  position:absolute;
  width:22px;
  height:22px;
  border:5px solid #ffe600;
  border-radius:50%;
  z-index:16;
  filter:drop-shadow(0 0 3px #fff);
}

.key:after{
  content:"";
  position:absolute;
  width:18px;
  height:5px;
  background:#ffe600;
  right:-17px;
  top:4px;
}

/* PUERTA */

.door{
  position:absolute;
  width:52px;
  height:76px;
  background:#eee;
  border:5px solid #555;
  z-index:10;
}

.door.locked{
  background:#777;
}

.door:after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#222;
  right:7px;
  top:32px;
}

/* PORTAL */

#portal{
  display:none;
  position:absolute;
  width:78px;
  height:110px;
  border-radius:50%;
  background:#210a48;
  border:8px solid #682cff;
  box-shadow:
    0 0 10px #8d5aff,
    0 0 30px #6c35ff,
    inset 0 0 25px #c19aff;
  z-index:25;
  animation:portal 1s infinite alternate;
}

@keyframes portal{
  from{transform:scale(.94)}
  to{transform:scale(1.08)}
}

#portalLabel{
  position:absolute;
  width:160px;
  left:-49px;
  top:-34px;
  color:white;
  text-align:center;
  font-weight:bold;
  text-shadow:0 2px 5px black;
}

/* MENSAJE */

#message{
  display:none;
  position:absolute;
  z-index:100;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(15,15,15,.95);
  color:white;
  padding:28px;
  border-radius:14px;
  text-align:center;
  min-width:290px;
}

#message h2{
  margin-bottom:10px;
}

#message p{
  color:#ddd;
}

#message button{
  margin-top:18px;
  border:0;
  background:#39c463;
  color:white;
  padding:12px 22px;
  border-radius:8px;
  font-weight:bold;
}

/* CONTROLES */

#controls{
  position:absolute;
  bottom:18px;
  left:18px;
  z-index:60;
  display:flex;
  gap:9px;
}

.control{
  width:58px;
  height:58px;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:24px;
}

#jump{
  margin-left:8px;
}

#mobileRestart{
  position:absolute;
  right:18px;
  bottom:18px;
  z-index:60;
  border:0;
  border-radius:10px;
  background:rgba(0,0,0,.65);
  color:white;
  padding:14px;
  font-weight:bold;
}

@media(max-width:700px){
  #world{
    transform:translate(-50%,-50%) scale(.72);
  }
}

@media(max-width:500px){
  #world{
    transform:translate(-50%,-50%) scale(.58);
  }
}
</style>

/* =========================
   CARGAR NIVEL
========================= */

function loadLevel(n){

  level=n;

  const data=levels[(n-1)%20];

  world.innerHTML="";

  portal.style.display="none";

  keyTaken=false;
  finished=false;

  x=55;
  y=530;
  vx=0;
  vy=0;

  levelName.textContent=
    n<=20 ? "NIVEL "+n : "ZONA 2 • NIVEL "+(n-20);

  /* bloques */

  data.blocks.forEach(b=>{

    const el=document.createElement("div");

    el.className="block";

    el.style.left=b[0]+"px";
    el.style.top=b[1]+"px";
    el.style.width=b[2]+"px";
    el.style.height=b[3]+"px";

    world.appendChild(el);

  });


  /* pinchos */

  data.spikes.forEach(s=>{

    const el=document.createElement("div");

    el.className="spike";

    el.style.left=s[0]+"px";
    el.style.top=s[1]+"px";

    world.appendChild(el);

  });


  /* llave */

  if(data.key){

    const key=document.createElement("div");

    key.className="key";

    key.id="key";

    key.style.left=data.key.x+"px";
    key.style.top=data.key.y+"px";

    world.appendChild(key);

  }


  /* puerta */

  const door=document.createElement("div");

  door.id="door";

  door.className="door";

  if(data.key){
    door.classList.add("locked");
  }

  door.style.left=data.door.x+"px";
  door.style.top=data.door.y+"px";

  world.appendChild(door);


  player.style.left=x+"px";
  player.style.top=y+"px";

  message.style.display="none";
}


/* =========================
   COLISIONES
========================= */

function collision(a,b){

  return(
    a.left<b.right &&
    a.right>b.left &&
    a.top<b.bottom &&
    a.bottom>b.top
  );

}


function playerRect(){

  return{
    left:x,
    right:x+28,
    top:y,
    bottom:y+38
  };

}


/* =========================
   ACTUALIZAR JUEGO
========================= */

function gameLoop(){

  if(!finished){

    if(left){
      vx=-moveSpeed;
    }
    else if(right){
      vx=moveSpeed;
    }
    else{
      vx*=.78;
    }

    x+=vx;

    if(x<0)x=0;
    if(x>1060)x=1060;


    vy+=gravity;

    y+=vy;

    grounded=false;


    const p=playerRect();


    /* plataformas */

    document.querySelectorAll(".block").forEach(el=>{

      const r={
        left:parseFloat(el.style.left),
        right:parseFloat(el.style.left)+el.offsetWidth,
        top:parseFloat(el.style.top),
        bottom:parseFloat(el.style.top)+el.offsetHeight
      };

      if(
        p.right>r.left &&
        p.left<r.right &&
        p.bottom>r.top &&
        p.bottom<r.bottom+18 &&
        vy>=0
      ){

        y=r.top-38;

        vy=0;

        grounded=true;

      }

    });


    /* salto */

    if(jumpRequest && grounded){

      vy=-jumpPower;

      grounded=false;

    }

    jumpRequest=false;


    /* pinchos */

    document.querySelectorAll(".spike").forEach(el=>{

      const s={
        left:parseFloat(el.style.left),
        right:parseFloat(el.style.left)+30,
        top:parseFloat(el.style.top)+8,
        bottom:parseFloat(el.style.top)+34
      };

      if(collision(p,s)){

        loadLevel(level);

      }

    });


    /* caída */

    if(y>640){

      loadLevel(level);

    }


    /* llave */

    const key=document.getElementById("key");

    if(key && !keyTaken){

      const k={
        left:parseFloat(key.style.left),
        right:parseFloat(key.style.left)+22,
        top:parseFloat(key.style.top),
        bottom:parseFloat(key.style.top)+22
      };

      if(collision(p,k)){

        keyTaken=true;

        key.remove();

        const door=document.getElementById("door");

        if(door){
          door.classList.remove("locked");
        }

      }

    }


    /* puerta */

    const door=document.getElementById("door");

    if(door){

      const d={
        left:parseFloat(door.style.left),
        right:parseFloat(door.style.left)+52,
        top:parseFloat(door.style.top),
        bottom:parseFloat(door.style.top)+76
      };

      if(collision(p,d)){

        const needsKey=levels[(level-1)%20].key;

        if(!needsKey || keyTaken){

          completeLevel();

        }

      }

    }


    /* portal */

    if(level===20 && keyTaken){

      portal.style.display="block";

      portal.style.left="930px";
      portal.style.top="280px";

      const po={
        left:930,
        right:1008,
        top:280,
        bottom:390
      };

      if(collision(p,po)){

        openNextZone();

      }

    }


    player.style.left=x+"px";
    player.style.top=y+"px";

  }

  requestAnimationFrame(gameLoop);

}


/* =========================
   COMPLETAR NIVEL
========================= */

function completeLevel(){

  if(finished)return;

  finished=true;

  if(level<20){

    messageTitle.textContent="¡NIVEL COMPLETADO!";

    messageText.textContent=
      "Nivel "+level+" superado.";

    messageButton.textContent=
      "SIGUIENTE NIVEL";

    messageButton.onclick=()=>{

      loadLevel(level+1);

    };

  }
  else{

    messageTitle.textContent=
      "¡HAS COMPLETADO LOS 20 NIVELES!";

    messageText.textContent=
      "El portal se ha desbloqueado.";

    messageButton.textContent=
      "ABRIR PORTAL";

    messageButton.onclick=()=>{

      message.style.display="none";

      finished=false;

      portal.style.display="block";

    };

  }

  message.style.display="block";

}


/* =========================
   SIGUIENTE ZONA
========================= */

function openNextZone(){

  finished=true;

  messageTitle.textContent=
    "¡PORTAL ACTIVADO!";

  messageText.textContent=
    "Has llegado a la siguiente zona.";

  messageButton.textContent=
    "CONTINUAR";

  messageButton.onclick=()=>{

    message.style.display="none";

    loadLevel(21);

  };

  message.style.display="block";

}


/* =========================
   TECLADO
========================= */

document.addEventListener("keydown",e=>{

  if(
    e.key==="ArrowLeft" ||
    e.key.toLowerCase()==="a"
  ){
    left=true;
  }

  if(
    e.key==="ArrowRight" ||
    e.key.toLowerCase()==="d"
  ){
    right=true;
  }

  if(
    e.key==="ArrowUp" ||
    e.key===" " ||
    e.key.toLowerCase()==="w"
  ){
    jumpRequest=true;
  }

  if(e.key.toLowerCase()==="r"){

    loadLevel(level);

  }

});


document.addEventListener("keyup",e=>{

  if(
    e.key==="ArrowLeft" ||
    e.key.toLowerCase()==="a"
  ){
    left=false;
  }

  if(
    e.key==="ArrowRight" ||
    e.key.toLowerCase()==="d"
  ){
    right=false;
  }

});


/* =========================
   CONTROLES TÁCTILES
========================= */

function hold(button,down,up){

  button.addEventListener("touchstart",e=>{
    e.preventDefault();
    down();
  });

  button.addEventListener("touchend",e=>{
    e.preventDefault();
    up();
  });

  button.addEventListener("mousedown",down);

  button.addEventListener("mouseup",up);

  button.addEventListener("mouseleave",up);

}


hold(
  document.getElementById("left"),
  ()=>left=true,
  ()=>left=false
);

hold(
  document.getElementById("right"),
  ()=>right=true,
  ()=>right=false
);


document.getElementById("jump").addEventListener(
  "mousedown",
  ()=>jumpRequest=true
);

document.getElementById("jump").addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    jumpRequest=true;
  }
);
