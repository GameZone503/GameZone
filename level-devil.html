<title>Level Devil - GameZone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#juego{
    position:relative;
    width:100vw;
    height:100vh;
    max-width:1100px;
    max-height:650px;
    background:#080808;
    overflow:hidden;
}

/* PARTE SUPERIOR */

#barra{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:52px;
    background:#111;
    border-bottom:2px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    color:white;
    z-index:20;
}

#titulo{
    font-size:20px;
    font-weight:bold;
}

#nivelTexto{
    font-size:16px;
    color:#bbb;
}

/* MUNDO */

#mundo{
    position:absolute;
    left:0;
    top:52px;
    width:100%;
    height:calc(100% - 52px);
    background:#090909;
    overflow:hidden;
}

/* TEXTO */

#mensaje{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    color:#777;
    font-size:14px;
    z-index:10;
    pointer-events:none;
}

/* JUGADOR */

#jugador{
    position:absolute;
    width:24px;
    height:30px;
    background:#f2f2f2;
    border-radius:4px 4px 2px 2px;
    z-index:8;
}

#jugador::before{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    background:#111;
    left:5px;
    top:7px;
    box-shadow:9px 0 #111;
}

/* SOMBRA DEL JUGADOR */

#jugador::after{
    content:"";
    position:absolute;
    width:18px;
    height:4px;
    background:#000;
    opacity:.5;
    left:3px;
    bottom:-6px;
    border-radius:50%;
}

/* PLATAFORMAS */

.plataforma{
    position:absolute;
    background:#eeeeee;
    height:18px;
    z-index:5;
}

/* SUELO */

.suelo{
    position:absolute;
    height:22px;
    background:#eeeeee;
    z-index:5;
}

/* PUERTA */

.puerta{
    position:absolute;
    width:48px;
    height:68px;
    background:#181818;
    border:4px solid #eeeeee;
    z-index:6;
}

.puerta::before{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:#eee;
    border-radius:50%;
    right:7px;
    top:28px;
}

/* META */

.meta{
    position:absolute;
    width:10px;
    height:80px;
    background:#ddd;
    z-index:4;
}

.meta::after{
    content:"";
    position:absolute;
    top:0;
    left:10px;
    width:42px;
    height:28px;
    background:#eee;
    clip-path:polygon(0 0,100% 50%,0 100%);
}

/* PINCHOS */

.pincho{
    position:absolute;
    width:0;
    height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-bottom:28px solid #e8e8e8;
    z-index:7;
}

/* PINCHOS AL REVÉS */

.pincho.abajo{
    border-bottom:none;
    border-top:28px solid #e8e8e8;
}

/* BLOQUE */

.bloque{
    position:absolute;
    background:#ddd;
    z-index:5;
}

/* PANTALLA DE GANAR */

#ganaste{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:50;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

#ganaste h1{
    font-size:42px;
    margin-bottom:12px;
}

#ganaste p{
    color:#aaa;
    margin-bottom:25px;
}

#ganaste button,
#reiniciar{
    border:none;
    background:#eee;
    color:#111;
    padding:12px 24px;
    font-weight:bold;
    border-radius:6px;
    cursor:pointer;
}

#ganaste button:hover,
#reiniciar:hover{
    background:white;
}

/* CONTROLES */

#controles{
    position:absolute;
    bottom:18px;
    left:18px;
    z-index:30;
    display:flex;
    gap:8px;
}

.control{
    width:48px;
    height:48px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.control:active{
    background:rgba(255,255,255,.28);
}

#reiniciar{
    position:absolute;
    right:18px;
    bottom:18px;
    z-index:30;
    padding:10px 16px;
    background:rgba(255,255,255,.12);
    color:white;
}

/* CELULAR */

@media(max-width:600px){

    #barra{
        height:45px;
    }

    #titulo{
        font-size:16px;
    }

    #nivelTexto{
        font-size:13px;
    }

    #mundo{
        top:45px;
        height:calc(100% - 45px);
    }

    #controles{
        bottom:12px;
        left:12px;
    }

    .control{
        width:44px;
        height:44px;
    }

    #reiniciar{
        right:12px;
        bottom:12px;
    }
}
</style>
</head>

    <div id="barra">
        <div id="titulo">LEVEL DEVIL</div>
        <div id="nivelTexto">NIVEL <span id="numeroNivel">1</span></div>
    </div>

        <div id="mensaje">
            Llega a la puerta
        </div>

        </div>

        <div id="controles">
            <button class="control" id="izquierda">◀</button>
            <button class="control" id="derecha">▶</button>
            <button class="control" id="salto">▲</button>
        </div>

        <button id="reiniciar" onclick="reiniciarNivel()">
            ↻

</div>

const velocidad = 4.5;
const salto = -12;

/* ================= CARGAR NIVEL ================= */

function cargarNivel(){

    mundo.querySelectorAll(".plataforma,.pincho,.puerta,.bloque,.meta")
        .forEach(e => e.remove());

    plataformas = [];
    pinchos = [];
    puertas = [];
    bloques = [];

    const datos = niveles[nivel - 1];

    x = datos.jugador.x;
    y = datos.jugador.y;

    vx = 0;
    vy = 0;

    numeroNivel.textContent = nivel;

    datos.plataformas.forEach(p => {

        const elemento = document.createElement("div");

        elemento.className = "plataforma";

        elemento.style.left = p.x + "px";
        elemento.style.top = p.y + "px";
        elemento.style.width = p.w + "px";
        elemento.style.height = p.h + "px";

        mundo.appendChild(elemento);

        plataformas.push({
            x:p.x,
            y:p.y,
            w:p.w,
            h:p.h,
            element:elemento
        });
    });


    datos.pinchos.forEach(p => {

        const elemento = document.createElement("div");

        elemento.className = "pincho";

        elemento.style.left = p.x + "px";
        elemento.style.top = p.y + "px";

        mundo.appendChild(elemento);

        pinchos.push({
            x:p.x,
            y:p.y,
            w:26,
            h:28,
            element:elemento
        });
    });


    const puerta = document.createElement("div");

    puerta.className = "puerta";

    puerta.style.left = datos.puerta.x + "px";
    puerta.style.top = datos.puerta.y + "px";

    mundo.appendChild(puerta);

    puertas.push({
        x:datos.puerta.x,
        y:datos.puerta.y,
        w:48,
        h:68,
        element:puerta
    });


    ganaste.style.display = "none";

    jugando = true;
}


/* ================= FISICA ================= */

function actualizar(){

    if(!jugando){
        requestAnimationFrame(actualizar);
        return;
    }

    if(izquierda){
        vx = -velocidad;
    }else if(derecha){
        vx = velocidad;
    }else{
        vx *= .75;
    }

    vy += gravedad;

    let nuevoX = x + vx;
    let nuevoY = y + vy;

    enSuelo = false;


    /* LIMITES */

    if(nuevoX < 0){
        nuevoX = 0;
        vx = 0;
    }

    if(nuevoX > mundo.clientWidth - 24){
        nuevoX = mundo.clientWidth - 24;
        vx = 0;
    }


    /* COLISIONES */

    for(const p of plataformas){

        if(
            nuevoX + 24 > p.x &&
            nuevoX < p.x + p.w &&
            y + 30 <= p.y &&
            nuevoY + 30 >= p.y &&
            vy >= 0
        ){

            nuevoY = p.y - 30;
            vy = 0;
            enSuelo = true;
        }
    }


    x = nuevoX;
    y = nuevoY;


    /* CAER */

    if(y > mundo.clientHeight + 80){

        morir();

    }


    /* PINCHOS */

    for(const p of pinchos){

        if(colision(
            x,y,24,30,
            p.x,p.y,p.w,p.h
        )){

            morir();

        }
    }


    /* PUERTA */

    for(const p of puertas){

        if(colision(
            x,y,24,30,
            p.x,p.y,p.w,p.h
        )){

            completarNivel();

        }
    }


    jugador.style.left = x + "px";
    jugador.style.top = y + "px";


    requestAnimationFrame(actualizar);
}


/* ================= COLISION ================= */

function colision(ax,ay,aw,ah,bx,by,bw,bh){

    return(
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );
}


/* ================= MORIR ================= */

function morir(){

    jugando = false;

    jugador.style.transform = "rotate(90deg)";

    setTimeout(() => {

        jugador.style.transform = "";

        cargarNivel();

    },450);
}


/* ================= COMPLETAR ================= */

function completarNivel(){

    jugando = false;

    if(nivel >= niveles.length){

        ganaste.querySelector("h1").textContent =
            "¡HAS COMPLETADO EL JUEGO!";

        ganaste.querySelector("p").textContent =
            "¡Todos los niveles superados!";

        ganaste.querySelector("button").textContent =
            "JUGAR DE NUEVO";

        ganaste.querySelector("button").onclick =
            function(){

                nivel = 1;
                cargarNivel();

            };

    }else{

        ganaste.querySelector("h1").textContent =
            "¡NIVEL COMPLETADO!";

        ganaste.querySelector("p").textContent =
            "Prepárate para el siguiente nivel.";

        ganaste.querySelector("button").textContent =
            "SIGUIENTE NIVEL";

        ganaste.querySelector("button").onclick =
            siguienteNivel;
    }

    ganaste.style.display = "flex";
}


/* ================= SIGUIENTE ================= */

function siguienteNivel(){

    nivel++;

    if(nivel > niveles.length){
        nivel = 1;
    }

    cargarNivel();
}


/* ================= REINICIAR ================= */

function reiniciarNivel(){

    cargarNivel();
}


/* ================= SALTAR ================= */

function saltar(){

    if(enSuelo && jugando){

        vy = salto;

        enSuelo = false;

    }
}


/* ================= TECLADO ================= */

document.addEventListener("keydown",function(e){

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){

        izquierda = true;

    }


    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){

        derecha = true;

    }


    if(
        e.key === "ArrowUp" ||
        e.key === " " ||
        e.key.toLowerCase() === "w"
    ){

        e.preventDefault();

        saltar();

    }

});


document.addEventListener("keyup",function(e){

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){

        izquierda = false;

    }


    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){

        derecha = false;

    }

});


/* ================= BOTONES ================= */

const botonIzq = document.getElementById("izquierda");
const botonDer = document.getElementById("derecha");
const botonSalto = document.getElementById("salto");


botonIzq.addEventListener("pointerdown",function(){
    izquierda = true;
});

botonIzq.addEventListener("pointerup",function(){
    izquierda = false;
});

botonIzq.addEventListener("pointerleave",function(){
    izquierda = false;
});


botonDer.addEventListener("pointerdown",function(){
    derecha = true;
});

botonDer.addEventListener("pointerup",function(){
    derecha = false;
});

botonDer.addEventListener("pointerleave",function(){
    derecha = false;
});


botonSalto.addEventListener("pointerdown",function(){
    saltar();
});


/* ================= INICIO ================= */

cargarNivel();

actualizar();

</script>
