<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Racing Limits - GAMEZONE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   BARRA SUPERIOR
========================= */

header{
    width:100%;
    height:68px;
    background:#050505;
    border-bottom:2px solid #ff9800;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px 0 22px;
}

/* LOGO */

.logo{
    color:#ff9800;
    font-size:38px;
    font-weight:900;
    letter-spacing:4px;
}

/* CONTROLES */

.controles{
    display:flex;
    align-items:center;
    gap:10px;
}

/* BOTONES */

.boton{
    height:56px;
    min-width:58px;

    border:none;
    border-radius:10px;

    background:#ff9800;
    color:#111;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:0.15s;
}

.boton:hover{
    background:#ffb52e;
    transform:translateY(-1px);
}

.boton:active{
    transform:scale(.96);
}

/* BOTÓN VOLVER */

.boton-volver{
    padding:0 22px;
    font-size:16px;
}

/* =========================
   ÁREA PRINCIPAL
========================= */

main{
    width:100%;
    height:calc(100vh - 68px);
    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

/* =========================
   PANTALLA GAMEZONE
========================= */

.pantalla{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #242424 0%,
            #101010 45%,
            #000 100%
        );

    color:white;
}

/* ICONO */

.icono{
    font-size:110px;
    margin-bottom:20px;
}

/* TÍTULO */

.pantalla h1{
    color:#ff9800;
    font-size:42px;
    margin-bottom:12px;
    text-align:center;
}

/* TEXTO */

.pantalla p{
    color:#aaa;
    font-size:17px;
    text-align:center;
    max-width:650px;
    line-height:1.5;
    margin:0 20px 30px;
}

/* =========================
   BOTÓN JUGAR
========================= */

.jugar{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:260px;
    padding:17px 30px;

    background:#ff9800;
    color:#111;

    border-radius:10px;

    text-decoration:none;

    font-size:21px;
    font-weight:900;

    transition:.2s;
}

.jugar:hover{
    background:#ffb52e;
    transform:scale(1.04);
}

.jugar:active{
    transform:scale(.98);
}

/* =========================
   INFORMACIÓN
========================= */

.aviso{
    margin-top:22px;
    color:#666;
    font-size:13px;
    text-align:center;
}

/* =========================
   PANTALLA COMPLETA
========================= */

:fullscreen main{
    height:100vh;
}

:fullscreen header{
    display:none;
}

:fullscreen .pantalla{
    height:100vh;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

    header{
        height:60px;
        padding:0 10px 0 14px;
    }

    .logo{
        font-size:23px;
        letter-spacing:3px;
    }

    .controles{
        gap:6px;
    }

    .boton{
        height:46px;
        min-width:46px;
        font-size:15px;
        border-radius:8px;
    }

    .boton-volver{
        padding:0 12px;
        font-size:12px;
    }

    main{
        height:calc(100vh - 60px);
    }

    .icono{
        font-size:75px;
    }

    .pantalla h1{
        font-size:30px;
    }

    .pantalla p{
        font-size:14px;
    }

    .jugar{
        min-width:220px;
        font-size:18px;
        padding:15px 25px;
    }
}
</style>
</head>

<body>

<!-- =========================
     BARRA GAMEZONE
========================= -->

<header>

    <div class="logo">
        GAMEZONE
    </div>

    <div class="controles">

        <button
            class="boton boton-volver"
            onclick="volverGameZone()">
            ← GAMEZONE
        </button>

        <button
            class="boton"
            onclick="recargarPagina()"
            title="Recargar">
            🔄
        </button>

        <button
            class="boton"
            onclick="pantallaCompleta()"
            title="Pantalla completa">
            ⛶
        </button>

    </div>

</header>


<!-- =========================
     CONTENIDO
========================= -->

<main id="zonaJuego">

    <section class="pantalla">

        <div class="icono">
            🏎️
        </div>

        <h1>
            Racing Limits
        </h1>

        <p>
            Bienvenido a Racing Limits en GAMEZONE.
            Pulsa el botón para comenzar a jugar.
        </p>

        <a
            class="jugar"
            href="https://www.crazygames.com/es/game/racing-limits"
            target="_blank"
            rel="noopener noreferrer">

            ▶ JUGAR RACING LIMITS

        </a>

        <div class="aviso">
            El juego se abre directamente para evitar problemas de conexión.
        </div>

    </section>

</main>


<script>

/* =========================
   VOLVER A GAMEZONE
========================= */

function volverGameZone(){

    window.location.href = "index.html";

}


/* =========================
   RECARGAR
========================= */

function recargarPagina(){

    window.location.reload();

}


/* =========================
   PANTALLA COMPLETA
========================= */

function pantallaCompleta(){

    const zona = document.getElementById("zonaJuego");

    if(document.fullscreenElement){

        document.exitFullscreen();

        return;

    }

    if(zona.requestFullscreen){

        zona.requestFullscreen();

    }

}

</script>

</body>
</html>
