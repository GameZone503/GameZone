<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Limits - GAMEZONE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:white;
}

body{
  min-height:100vh;
}

/* CABECERA */
header{
  height:70px;
  background:#111;
  border-bottom:2px solid #ff9800;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.logo{
  color:#ff9800;
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
}

.volver{
  background:#ff9800;
  color:#111;
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font-weight:bold;
  cursor:pointer;
}

/* CONTENIDO */
main{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.panel{
  width:min(900px,100%);
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  overflow:hidden;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.titulo{
  padding:25px 20px;
  background:#1d1d1d;
}

.titulo h1{
  color:#ff9800;
  font-size:34px;
  margin-bottom:8px;
}

.titulo p{
  color:#aaa;
  font-size:16px;
}

/* ZONA DEL JUEGO */
.juego{
  min-height:430px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:35px 20px;
  background:
    radial-gradient(circle at center,#222 0%,#0b0b0b 70%);
}

.icono{
  font-size:100px;
  margin-bottom:20px;
}

.juego h2{
  font-size:28px;
  margin-bottom:12px;
}

.juego p{
  color:#aaa;
  max-width:600px;
  line-height:1.5;
  margin-bottom:28px;
}

/* BOTÓN JUGAR */
.jugar{
  display:inline-block;
  background:#ff9800;
  color:#111;
  text-decoration:none;
  padding:17px 42px;
  border-radius:10px;
  font-size:21px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.jugar:hover{
  background:#ffb52e;
  transform:scale(1.04);
}

/* CONTROLES */
.controles{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:18px;
  background:#111;
}

.boton{
  background:#292929;
  color:white;
  border:1px solid #444;
  border-radius:8px;
  padding:11px 18px;
  cursor:pointer;
  font-weight:bold;
}

.boton:hover{
  background:#3a3a3a;
}

/* MÓVIL */
@media(max-width:600px){

  header{
    height:60px;

  }

  .volver{
    padding:9px 11px;

  }

  main{
    padding:12px;
  }

  .titulo h1{
    font-size:27px;
  }

  .juego{
    min-height:380px;
  }

  .icono{
    font-size:75px;
  }

  .jugar{
    padding:15px 30px;
    font-size:18px;
  }

  .controles{
    flex-wrap:wrap;
  }
}
</style>
</head>
