<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racing Limits - GAMEZONE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080810;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      background: #11111c;
      padding: 20px;
      border-bottom: 2px solid #292943;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 4px;
    }

    header p {
      margin: 6px 0 0;
      color: #aaa;
    }

    .controles {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 15px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #6c63ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #827aff;
    }

    .juego {
      width: 96%;
      max-width: 1200px;
      height: 650px;
      margin: 10px auto 30px;
      background: #000;
      border: 2px solid #292943;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .nota {
      text-align: center;
      color: #888;
      padding: 0 15px 30px;
    }

    @media (max-width: 700px) {
      .juego {
        height: 550px;
      }

      header h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>GAMEZONE</h1>
    <p>Racing Limits</p>
  </header>

  <div class="controles">
    <button onclick="volver()">VOLVER</button>
    <button onclick="reiniciar()">REINICIAR</button>
    <button onclick="pantallaCompleta()">PANTALLA COMPLETA</button>
  </div>

  <div class="juego" id="contenedorJuego">
    <iframe
      id="juego"
      src="https://www.minijuegos.com/embed/racing-limits"
      title="Racing Limits"
      allow="fullscreen; autoplay"
      allowfullscreen>
    </iframe>
  </div>

  <div class="nota">
    Racing Limits · GAMEZONE
  </div>

  <script>
    function volver() {
      window.location.href = "index.html";
    }

    function reiniciar() {
      const iframe = document.getElementById("juego");
      iframe.src = "https://www.minijuegos.com/embed/racing-limits";
    }

    function pantallaCompleta() {
      const iframe = document.getElementById("juego");

      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      }
    }
  </script>

</body>
</html>
