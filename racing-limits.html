<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Limits - GAMEZONE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  width:100%;
  height:68px;
  background:#050505;
  border-bottom:2px solid #ff9800;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px 0 22px;
}

.logo{
  color:#ff9800;
  font-size:38px;
  font-weight:900;
  letter-spacing:4px;
}

.controles{
  display:flex;
  gap:10px;
}

.boton{
  height:56px;
  min-width:58px;
  border:none;
  border-radius:10px;
  background:#ff9800;
  color:#111;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.boton:hover{
  background:#ffb52e;
}

.boton-volver{
  padding:0 22px;
  font-size:16px;
}

main{
  width:100%;
  height:calc(100vh - 68px);
  background:#000;
}

#juego{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
}
</style>
</head>

<body>

<header>
  <div class="logo">GAMEZONE</div>

  <div class="controles">
    <button class="boton boton-volver" onclick="volverGameZone()">
      ← GAMEZONE
    </button>

    <button class="boton" onclick="location.reload()" title="Recargar">
      🔄
    </button>

    <button class="boton" onclick="pantallaCompleta()" title="Pantalla completa">
      ⛶
    </button>
  </div>
</header>

<main>
  <iframe
    id="juego"
    src="https://www.crazygames.com/es/game/racing-limits"
    allow="autoplay; fullscreen; gamepad"
    allowfullscreen>
  </iframe>
</main>

<script>
function volverGameZone(){
  window.location.href="index.html";
}

function pantallaCompleta(){
  const juego=document.getElementById("juego");

  if(document.fullscreenElement){
    document.exitFullscreen();
  }else{
    juego.requestFullscreen();
  }
}
</script>

</body>
</html>
