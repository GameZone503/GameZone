<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Racing Limits - GAMEZONE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:white;
}

body{
  display:flex;
  flex-direction:column;
}

/* CABECERA */
header{
  height:64px;
  flex-shrink:0;
  background:#111;
  border-bottom:2px solid #ff9800;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
  color:#ff9800;
}

.botones{
  display:flex;
  gap:8px;
}

button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  background:#ff9800;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ffb52e;
}

/* ZONA DEL JUEGO */
main{
  flex:1;
  position:relative;
  background:#000;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
}

/* PANTALLA DE CARGA */
.cargando{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:5;
  font-size:22px;
  color:#ff9800;
}

/* OCULTAR CARGANDO */
.oculto{
  display:none;
}

/* MÓVIL */
@media(max-width:600px){
  header{
    height:55px;
    padding:0 10px;
  }

  .logo{
    font-size:21px;
  }

  button{
    padding:8px 9px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    GAMEZONE
  </div>

  <div class="botones">

    <button onclick="volver()">
      ← GAMEZONE
    </button>

    <button onclick="recargar()">
      🔄
    </button>

    <button onclick="pantallaCompleta()">
      ⛶
    </button>

  </div>

</header>


<main id="zonaJuego">

  <div class="cargando" id="cargando">
    Cargando Racing Limits...
  </div>

  <iframe
    id="juego"
    src="https://www.crazygames.com/es/game/racing-limits"
    allow="fullscreen; autoplay"
    allowfullscreen>
  </iframe>

</main>


<script>

const juego = document.getElementById("juego");
const cargando = document.getElementById("cargando");


/* OCULTAR MENSAJE DE CARGA */
juego.addEventListener("load", function(){
  setTimeout(function(){
    cargando.classList.add("oculto");
  },1000);
});


/* RECARGAR */
function recargar(){

  cargando.classList.remove("oculto");

  juego.src = juego.src;

}


/* PANTALLA COMPLETA */
function pantallaCompleta(){

  const zona = document.getElementById("zonaJuego");

  if(zona.requestFullscreen){
    zona.requestFullscreen();
  }

}


/* VOLVER A GAMEZONE */
function volver(){

  window.location.href = "index.html";

}

</script>

</body>
</html>
