```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMEZONE - Build and Run</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

header {
    height: 60px;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    background: #252525;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #3a3a3a;
}

.game {
    width: 100%;
    height: calc(100vh - 60px);
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
</style>
</head>

<body>

<header>
    <div class="logo">GAMEZONE</div>

    <div class="buttons">
        <button onclick="history.back()">VOLVER</button>
        <button onclick="location.reload()">REINICIAR</button>
        <button onclick="fullscreen()">PANTALLA COMPLETA</button>
    </div>
</header>

<div class="game">
    <iframe
        id="gameFrame"
        src="https://html5.gamedistribution.com/405c00612981466cbc5d9dcef4214811/?gd_sdk_referrer_url=https://gamezone503.github.io/GameZone/build-and-run.html"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen>
    </iframe>
</div>

<script>
function fullscreen() {
    const frame = document.getElementById("gameFrame");

    if (frame.requestFullscreen) {
        frame.requestFullscreen();
    } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
    }
}
</script>

</body>
</html>
