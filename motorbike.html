<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GAMEZONE - Motorbike</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;font-family:Arial;overflow:hidden}
header{height:60px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.logo{font-size:25px;font-weight:bold}
.buttons{display:flex;gap:8px}
button{border:0;border-radius:7px;padding:9px 12px;background:#252525;color:white;font-weight:bold;cursor:pointer}
.game{width:100%;height:calc(100vh - 60px)}
iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<header>
<div class="logo">GAMEZONE</div>
<div class="buttons">
<button onclick="volver()">VOLVER</button>
<button onclick="reiniciar()">REINICIAR</button>
<button onclick="pantallaCompleta()">PANTALLA COMPLETA</button>
</div>
</header>
<div class="game">
<iframe id="gameFrame"
src="https://html5.gamedistribution.com/939466b673784325be7725224abbd70d/?gd_sdk_referrer_url=https://gamezone503.github.io/GameZone/motorbike.html"
allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
</div>
<script>
function volver(){window.location.href="index.html";}
function reiniciar(){const f=document.getElementById("gameFrame");f.src=f.src;}
function pantallaCompleta(){const f=document.getElementById("gameFrame");if(f.requestFullscreen)f.requestFullscreen();}
</script>
</body>
</html>
