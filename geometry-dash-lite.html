<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geometry Dash - GameZone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .gamezone {
            padding: 18px;
            font-size: 32px;
            font-weight: bold;
        }

        .game-title {
            font-size: 42px;
            margin: 10px 0 20px;
        }

        .juego {
            width: 95%;
            max-width: 1100px;
            height: 650px;
            margin: auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .volver {
            display: inline-block;
            margin: 20px;
            padding: 12px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .volver:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="gamezone">🎮 GameZone</div>

    <div class="game-title">Geometry Dash</div>

    <div class="juego">
        <iframe
            src="https://www.madkidgames.com/full/geometry-dash"
            allowfullscreen
            scrolling="no">
        </iframe>
    </div>

    <a class="volver" href="index.html">⬅ VOLVER A GAMEZONE</a>

</body>
</html>
