<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEZONE - Moto X3M</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

header{
    height:60px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    background:#252525;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#3a3a3a;
}

.game{
    width:100%;
    height:calc(100vh - 60px);
}

iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}
</style>
</head>

<body>

<header>
    <div class="logo">GAMEZONE</div>

    <div class="buttons">
        <button onclick="history.back()">VOLVER</button>
        <button onclick="location.reload()">REINICIAR</button>
        <button onclick="pantallaCompleta()">PANTALLA COMPLETA</button>
    </div>
</header>

<div class="game">

    <iframe
        id="gameFrame"
        src="https://play.famobi.com/moto-x3m"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen>
    </iframe>

</div>

<script>
function pantallaCompleta(){

    const juego = document.getElementById("gameFrame");

    if(juego.requestFullscreen){
        juego.requestFullscreen();
    }else if(juego.webkitRequestFullscreen){
        juego.webkitRequestFullscreen();
    }

}
</script>

</body>
</html>
