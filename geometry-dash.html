```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash - GameZone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

header{
    height:60px;
    min-height:60px;
    background:#111;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.botones{
    display:flex;
    gap:8px;
}

button{
    border:1px solid #444;
    border-radius:7px;
    padding:9px 13px;
    background:#222;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#333;
}

.contenido{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.caja{
    max-width:650px;
    padding:40px;
    border:1px solid #333;
    border-radius:18px;
    background:#151515;
}

.caja h1{
    font-size:42px;
    margin-bottom:15px;
}

.caja p{
    color:#aaa;
    line-height:1.6;
}

.estado{
    margin-top:20px;
    color:#777;
}

.volver{
    background:white;
    color:black;
}
</style>
</head>

<body>

<header>

<div class="logo">
GAMEZONE
</div>

<div class="botones">

<button class="volver" onclick="volver()">
← VOLVER
</button>

<button onclick="reiniciar()">
🔄 REINICIAR
</button>

<button onclick="pantallaCompleta()">
⛶ PANTALLA COMPLETA
</button>

</div>

</header>

<main class="contenido">

<div class="caja">

<h1>🎮 Geometry Dash</h1>

<p>
Esta versión externa del juego cambió de sitio.
GameZone no carga la página anterior para evitar
mostrar una pantalla incorrecta o una miniatura.
</p>

<div class="estado">
Geometry Dash • GameZone
</div>

</div>

</main>

<script>

function volver(){
    window.location.href="index.html";
}

function reiniciar(){
    location.reload();
}

function pantallaCompleta(){

    if(document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen();
    }

}

</script>

</body>
</html>
```
