```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Rider - GameZone</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 100%;
  height: 100%;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  height: 60px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  background: #111;
  border-bottom: 1px solid #333;
}
button {
  padding: 10px 14px;
  background: #222;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
#juego {
  width: 100%;
  height: calc(100% - 60px);
  border: 0;
  display: block;
  background: #000;
}
</style>
</head>
<body>

<header>
  <button onclick="history.back()">← VOLVER</button>
  <button onclick="reiniciar()">🔄 REINICIAR</button>
  <button onclick="pantallaCompleta()">⛶ PANTALLA COMPLETA</button>
</header>

<iframe
  id="juego"
  src="https://trafficrider.web.app/"
  allow="fullscreen; autoplay"
  allowfullscreen>
</iframe>

<script>
function reiniciar() {
  const juego = document.getElementById("juego");
  juego.src = juego.src;
}

function pantallaCompleta() {
  const juego = document.getElementById("juego");
  if (juego.requestFullscreen) {
    juego.requestFullscreen();
  }
}
</script>

</body>
</html>
```
