<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEZONE - Juego</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#0b0f16;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:15px;
}

h1{
    font-size:32px;
    margin-bottom:12px;
}

p{
    color:#aeb8c8;
    font-size:18px;
    margin-bottom:30px;
}

button{
    border:0;
    border-radius:10px;
    padding:14px 25px;
    margin:6px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.jugar{
    background:white;
    color:#111;
}

.volver{
    background:#303949;
    color:white;
}

button:hover{
    transform:scale(1.04);
}

@media(max-width:600px){
    .logo{
        font-size:30px;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="logo">GAMEZONE</div>

<h1 id="titulo">Cargando juego...</h1>

<p>
Pulsa JUGAR para abrir el juego.
</p>

<div>
    <button class="jugar" onclick="abrirJuego()">
        ▶ JUGAR
    </button>

    <button class="volver" onclick="volver()">
        ← VOLVER
    </button>
</div>

<script>

const juegos = {

    traffic:{
        nombre:"Traffic Racer",
        url:"https://www.crazygames.com/es/game/racing-limits"
    },

    highway:{
        nombre:"Highway Drive",
        url:"https://www.crazygames.com/es/game/real-car-driving"
    },

    drift:{
        nombre:"Drift Challenge",
        url:"https://www.crazygames.com/es/game/xtreme-city-drifting"
    }

};

const parametros = new URLSearchParams(window.location.search);

const juego = parametros.get("game");

const datos = juegos[juego];

if(datos){

    document.getElementById("titulo").textContent = datos.nombre;

}else{

    document.getElementById("titulo").textContent =
        "Juego no encontrado";

}

function abrirJuego(){

    if(datos){

        window.location.href = datos.url;

    }

}

function volver(){

    window.location.href = "index.html";

}

</script>

</body>
</html>
